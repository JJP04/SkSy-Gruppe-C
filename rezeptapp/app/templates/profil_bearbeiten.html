<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Profil bearbeiten</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="container">
   <h1 class="header dashboard">Profil bearbeiten</h1>

<form method="POST" enctype="multipart/form-data">
  <!-- Benutzername -->
  <h3 for="username">Benutzername:</h3>
  <input type="text" name="username" value="{{ user.username }}" required>

  <!-- E‑Mail -->
  <h3 for="email">E‑Mail:</h3>
  <input type="email" name="email" value="{{ user.email }}" required>

  <!-- Steckbrief -->
  <h3 for="steckbrief">Steckbrief:</h3>
  <textarea name="steckbrief" rows="4" style="width:100%;">{{ user.steckbrief or '' }}</textarea>

  <!-- Profilbild -->
  <h3 for="profilbild">Profilbild:</h3>
  {% if user.profilbild %}
    <img src="{{ url_for('static', filename=user.profilbild) }}"
         alt="Profilbild"
         style="max-width:150px; display:block; margin-bottom:1rem;">
  {% endif %}
  <input type="file" name="profilbild" accept="image/*">

  <!-- Buttons -->
  <div style="display:flex; gap:1rem; margin-top:1rem;">
    <a class="linkbutton" href="{{ url_for('dashboard.profile') }}">Abbruch</a>
    <button type="submit">Speichern</button>
  </div>
</form>

    <form action="{{ url_for('dashboard.profil_loeschen') }}" method="GET" onsubmit="return confirm('Willst du dein Profil wirklich löschen?')">
        <button type="submit" style="background-color: darkred;" >
            Profil löschen
        </button>
    </form>


</div>
</body>
</html>
